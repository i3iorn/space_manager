name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  schedule:
    # **The nightly checks run on a schedule.** The fuzz test plays ten
    # thousand campaigns of random orders and the balance harness plays a
    # hundred under each of the three reference policies, and neither is
    # something to run on every push.
    - cron: "17 4 * * *"

env:
  CARGO_TERM_COLOR: always
  # The simulation is deterministic, so a warning about an unused crate is
  # information, not noise. Keep it visible.
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: Format, lint, and test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      - name: Linting
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

  performance:
    name: Performance budgets
    runs-on: ubuntu-latest
    # **The budget is about the shipped build.** A debug build is five to
    # twenty times slower, and a budget that only holds in a release build is
    # checked in a release build.
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: The performance budgets
        run: cargo test --release -p sim --test performance

  determinism:
    name: Determinism across architectures
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # The determinism test lives with the simulation's own tests, but it is
      # worth running on two operating systems on its own: a stream that differs
      # between Windows and Linux would invalidate every replay made on the
      # other one.
      - name: Determinism test
        run: cargo test --workspace determinism

  nightly:
    name: Nightly checks
    runs-on: ubuntu-latest
    # **The heavy suites run on a schedule rather than on every push.** The
    # fuzz test plays ten thousand campaigns of random orders, and the balance
    # harness plays a hundred of them under each of the three reference
    # policies.
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Fuzzing
        run: cargo test --release -p sim --test fuzz -- --ignored

      - name: The balance harness
        run: cargo run --release -p sim --example harness -- first_orbit 40 60
